<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}看護管理者タスク管理{% endblock %} | CareScheduler</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <a class="brand" href="{{ url_for('today_view') }}">🩺 看護管理タスク</a>
      <nav class="main-nav">
        <a href="{{ url_for('today_view') }}" class="{{ 'active' if request.endpoint == 'today_view' }}">今日やること</a>
        <a href="{{ url_for('task_list') }}" class="{{ 'active' if request.endpoint == 'task_list' }}">タスク一覧</a>
        <a href="{{ url_for('schedule_view') }}" class="{{ 'active' if request.endpoint == 'schedule_view' }}">予定</a>
        <a href="{{ url_for('task_new') }}" class="btn btn--new">＋ 新規タスク</a>
      </nav>
    </div>
  </header>
  <main class="app-main">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='reminder.js') }}"></script>
</body>
</html>
